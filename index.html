<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BushidOS-soft</title>

  <script>
    (function (d) {
      var config = {
        kitId: 'ayw5nos',
        scriptTimeout: 3000,
        async: true
      },
        h = d.documentElement, t = setTimeout(function () { h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive"; }, config.scriptTimeout), tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a; h.className += " wf-loading"; tk.src = 'https://use.typekit.net/' + config.kitId + '.js'; tk.async = true; tk.onload = tk.onreadystatechange = function () { a = this.readyState; if (f || a && a != "complete" && a != "loaded") return; f = true; clearTimeout(t); try { Typekit.load(config) } catch (e) { } }; s.parentNode.insertBefore(tk, s)
    })(document);
  </script>
</head>

<body>
  <div id="app">
    <main class="splash">
      <h1>Katana Mode!!</h1>
      <p>あなたのスマホは刀になってしまいました…</p>
      <p id="status" class="status">Initializing camera...</p>
    </main>
  </div>
  <script>
    (async function () {
      var MOTION_THRESHOLD = 16;
      var PLAY_COOLDOWN_MS = 700;
      var audioSources = [
        './assets/katana.mp3',
        './public/assets/katana.mp3',
        '/assets/katana.mp3',
        '/BushidOS/assets/katana.mp3'
      ];
      var audioSrc = audioSources[audioSources.length - 1];
      var isMotionListening = false;
      var lastPlayedAt = 0;
      var hasPlayedEntryAudio = false;
      var audioContext = null;
      var decodedKatanaBuffer = null;

      async function resolveAudioSrc() {
        for (var i = 0; i < audioSources.length; i += 1) {
          try {
            var response = await fetch(audioSources[i], { method: 'HEAD' });

            if (response.ok) {
              return audioSources[i];
            }
          } catch (error) {
          }
        }

        return audioSrc;
      }

      audioSrc = await resolveAudioSrc();

      function getAudioContext() {
        if (!audioContext) {
          var AudioContextCtor = window.AudioContext || window.webkitAudioContext;

          if (!AudioContextCtor) {
            return null;
          }

          audioContext = new AudioContextCtor({ latencyHint: 'interactive' });
        }

        return audioContext;
      }

      async function ensureDecodedBuffer() {
        var ctx = getAudioContext();

        if (!ctx) {
          return null;
        }

        if (decodedKatanaBuffer) {
          return decodedKatanaBuffer;
        }

        try {
          var response = await fetch(audioSrc);

          if (!response.ok) {
            return null;
          }

          var arrayBuffer = await response.arrayBuffer();
          decodedKatanaBuffer = await ctx.decodeAudioData(arrayBuffer);
          return decodedKatanaBuffer;
        } catch (error) {
          return null;
        }
      }

      async function playKatanaLowLatency() {
        var ctx = getAudioContext();

        if (!ctx) {
          return false;
        }

        if (ctx.state !== 'running') {
          try {
            await ctx.resume();
          } catch (error) {
            return false;
          }
        }

        var buffer = await ensureDecodedBuffer();

        if (!buffer) {
          return false;
        }

        var source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        return true;
      }

      async function tryPlayEntryAudio() {
        if (hasPlayedEntryAudio) {
          return;
        }

        var didPlay = await playKatanaLowLatency();

        if (didPlay) {
          hasPlayedEntryAudio = true;
          lastPlayedAt = Date.now();
        }
      }

      function onDeviceMotion(event) {
        var source = event.accelerationIncludingGravity || event.acceleration;

        if (!source) {
          return;
        }

        var x = source.x || 0;
        var y = source.y || 0;
        var z = source.z || 0;
        var magnitude = Math.sqrt(x * x + y * y + z * z);
        var now = Date.now();

        if (magnitude < MOTION_THRESHOLD || now - lastPlayedAt < PLAY_COOLDOWN_MS) {
          return;
        }

        playKatanaLowLatency().then(function (didPlay) {
          if (didPlay) {
            lastPlayedAt = now;
          }
        });
      }

      function attachMotionListener() {
        if (isMotionListening) {
          return;
        }

        window.addEventListener('devicemotion', onDeviceMotion);
        isMotionListening = true;
      }

      async function enableMotion() {
        await tryPlayEntryAudio();
        await ensureDecodedBuffer();

        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            var result = await DeviceMotionEvent.requestPermission();

            if (result !== 'granted') {
              return;
            }
          } catch (error) {
            return;
          }
        }

        attachMotionListener();
      }

      tryPlayEntryAudio();
      window.addEventListener('click', enableMotion, { once: true });
      window.addEventListener('touchstart', enableMotion, { once: true });
      enableMotion();
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
