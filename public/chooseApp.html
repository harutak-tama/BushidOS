    <meta charset="UTF-8" />

    <meta http-equiv="Pragma" content="no-cache" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="./app-pages.css" />

    <script>
        (function (d) {
            var config = {
                kitId: 'ayw5nos',
                scriptTimeout: 3000,
                async: true
            },
                h = d.documentElement, t = setTimeout(function () { h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive"; }, config.scriptTimeout), tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a; h.className += " wf-loading"; tk.src = 'https://use.typekit.net/' + config.kitId + '.js'; tk.async = true; tk.onload = tk.onreadystatechange = function () { a = this.readyState; if (f || a && a != "complete" && a != "loaded") return; f = true; clearTimeout(t); try { Typekit.load(config) } catch (e) { } }; s.parentNode.insertBefore(tk, s)
        })(document);
    </script>

</head>

<body class="choose-app-body">
    <div class="flip-vertical choose-app-copy">
        <h1>Insert A UI Sheet</h1>
        <h1>UIシートを</h1>
        <h1>差し込んでください</h1>
        <img class="choose-app-sheet" src="./assets/UIsheet.svg" alt="UI sheet guide" />
    </div>

    <script>
        (async function () {
            const BRIGHTNESS_DELTA_THRESHOLD = 0.12;
            const MAGENTA_DELTA_THRESHOLD = 0.1;
            const SAMPLE_INTERVAL_MS = 100;
            const BRIGHTNESS_SMOOTH_ALPHA = 0.4;
            const INDEX_URL_CANDIDATES = [
                './index.html',
                '../index.html',
                '/index.html',
                '/BushidOS/index.html'
            ];

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return;
            }

            async function resolveIndexUrl() {
                for (let i = 0; i < INDEX_URL_CANDIDATES.length; i += 1) {
                    try {
                        const response = await fetch(INDEX_URL_CANDIDATES[i], { method: 'HEAD' });

                        if (response.ok) {
                            return INDEX_URL_CANDIDATES[i];
                        }
                    } catch (error) {
                    }
                }

                return './index.html';
            }

            const indexUrl = await resolveIndexUrl();

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            video.muted = true;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            if (!ctx) {
                return;
            }

            let stream;

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false,
                });
            } catch (error) {
                return;
            }

            video.srcObject = stream;

            try {
                await video.play();
            } catch (error) {
                stream.getTracks().forEach(function (track) { track.stop(); });
                return;
            }

            let smoothedBrightness = null;
            let previousBrightness = null;
            let previousMagentaScore = null;

            const intervalId = window.setInterval(function () {
                if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                    return;
                }

                canvas.width = 64;
                canvas.height = Math.max(36, Math.round((64 * video.videoHeight) / video.videoWidth));

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let luminanceSum = 0;
                let redSum = 0;
                let greenSum = 0;
                let blueSum = 0;

                for (let i = 0; i < imageData.length; i += 4) {
                    const r = imageData[i];
                    const g = imageData[i + 1];
                    const b = imageData[i + 2];
                    luminanceSum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    redSum += r;
                    greenSum += g;
                    blueSum += b;
                }

                const pixelCount = imageData.length / 4;
                const brightness = luminanceSum / (pixelCount * 255);
                smoothedBrightness =
                    smoothedBrightness === null
                        ? brightness
                        : smoothedBrightness + BRIGHTNESS_SMOOTH_ALPHA * (brightness - smoothedBrightness);
                const brightnessDelta = previousBrightness === null
                    ? 0
                    : smoothedBrightness - previousBrightness;
                previousBrightness = smoothedBrightness;
                const avgRed = redSum / (pixelCount * 255);
                const avgGreen = greenSum / (pixelCount * 255);
                const avgBlue = blueSum / (pixelCount * 255);
                const magentaScore = ((avgRed + avgBlue) / 2) - avgGreen;
                const magentaDelta = previousMagentaScore === null
                    ? 0
                    : magentaScore - previousMagentaScore;
                previousMagentaScore = magentaScore;
                const shouldGoPhone = magentaDelta >= MAGENTA_DELTA_THRESHOLD;
                const shouldReturnToIndex = brightnessDelta >= BRIGHTNESS_DELTA_THRESHOLD;

                console.log(
                    '[brightness] ' + brightness.toFixed(3) +
                    ', [smooth] ' + smoothedBrightness.toFixed(3) +
                    ', [delta] ' + brightnessDelta.toFixed(3) +
                    ', [rgb] ' + avgRed.toFixed(3) + ', ' + avgGreen.toFixed(3) + ', ' + avgBlue.toFixed(3) +
                    ', [magentaScore] ' + magentaScore.toFixed(3) +
                    ', [magentaDelta] ' + magentaDelta.toFixed(3) +
                    ', [goPhone] ' + shouldGoPhone +
                    ', [returnIndex] ' + shouldReturnToIndex
                );

                if (shouldGoPhone) {
                    window.clearInterval(intervalId);
                    stream.getTracks().forEach(function (track) { track.stop(); });
                    window.location.replace('./phoneApp.html');
                    return;
                }

                if (shouldReturnToIndex) {
                    window.clearInterval(intervalId);
                    stream.getTracks().forEach(function (track) { track.stop(); });
                    window.location.replace(indexUrl);
                    return;
                }
            }, SAMPLE_INTERVAL_MS);
        })();
    </script>
</body>

</html>
