<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BushidOS-soft</title>

  <script>
    (function (d) {
      var config = {
        kitId: 'ayw5nos',
        scriptTimeout: 3000,
        async: true
      },
        h = d.documentElement, t = setTimeout(function () { h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive"; }, config.scriptTimeout), tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a; h.className += " wf-loading"; tk.src = 'https://use.typekit.net/' + config.kitId + '.js'; tk.async = true; tk.onload = tk.onreadystatechange = function () { a = this.readyState; if (f || a && a != "complete" && a != "loaded") return; f = true; clearTimeout(t); try { Typekit.load(config) } catch (e) { } }; s.parentNode.insertBefore(tk, s)
    })(document);
  </script>
</head>

<body>
  <div id="app">
    <main class="splash">
      <h1>Katana Mode!!</h1>
      <p id="status" class="status">Initializing camera...</p>
    </main>
  </div>
  <script>
    (function () {
      var MOTION_THRESHOLD = 16;
      var PLAY_COOLDOWN_MS = 700;
      var audio = new Audio('./assets/katana.mp3');
      var isMotionListening = false;
      var lastPlayedAt = 0;

      audio.preload = 'auto';

      function onDeviceMotion(event) {
        var source = event.accelerationIncludingGravity || event.acceleration;

        if (!source) {
          return;
        }

        var x = source.x || 0;
        var y = source.y || 0;
        var z = source.z || 0;
        var magnitude = Math.sqrt(x * x + y * y + z * z);
        var now = Date.now();

        if (magnitude < MOTION_THRESHOLD || now - lastPlayedAt < PLAY_COOLDOWN_MS) {
          return;
        }

        lastPlayedAt = now;
        audio.currentTime = 0;
        audio.play().catch(function () {
        });
      }

      function attachMotionListener() {
        if (isMotionListening) {
          return;
        }

        window.addEventListener('devicemotion', onDeviceMotion);
        isMotionListening = true;
      }

      async function enableMotion() {
        if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
          try {
            var result = await DeviceMotionEvent.requestPermission();

            if (result !== 'granted') {
              return;
            }
          } catch (error) {
            return;
          }
        }

        attachMotionListener();
      }

      window.addEventListener('click', enableMotion, { once: true });
      window.addEventListener('touchstart', enableMotion, { once: true });
      enableMotion();
    })();
  </script>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
