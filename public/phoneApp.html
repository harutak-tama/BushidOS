<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone App</title>
    <link rel="stylesheet" href="./app-pages.css" />
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>

    <script>
        (function (d) {
            var config = {
                kitId: 'ayw5nos',
                scriptTimeout: 3000,
                async: true
            },
                h = d.documentElement, t = setTimeout(function () { h.className = h.className.replace(/\bwf-loading\b/g, "") + " wf-inactive"; }, config.scriptTimeout), tk = d.createElement("script"), f = false, s = d.getElementsByTagName("script")[0], a; h.className += " wf-loading"; tk.src = 'https://use.typekit.net/' + config.kitId + '.js'; tk.async = true; tk.onload = tk.onreadystatechange = function () { a = this.readyState; if (f || a && a != "complete" && a != "loaded") return; f = true; clearTimeout(t); try { Typekit.load(config) } catch (e) { } }; s.parentNode.insertBefore(tk, s)
        })(document);
    </script>

</head>

<body class="phone-app-body flip-vertical">
    <main class="phone-app">
        <section class="phone-device" aria-label="Simple phone app mockup">
            <div class="phone-device__paper">
                <section class="phone-device__display-section" aria-label="Display section">
                    <p>白い部分を鞘の外に出してください</p>
                    <h1 class="phone-device__title">Phone</h1>

                    <div class="phone-device__statusbar">
                        <span id="statusLabel">Ready</span>
                    </div>

                    <div class="phone-device__display" id="dialDisplay">_</div>
                </section>

                <section class="phone-device__keypad-section phone-device__keypad-section--glow-only"
                    aria-label="Keypad section">
                    <div class="phone-device__quick">
                        <button class="quick-btn" data-number="110">Emergency</button>
                    </div>

                    <div class="phone-device__pad" aria-label="Dial pad">
                        <button class="pad-btn" data-key="1">1</button>
                        <button class="pad-btn" data-key="2">2</button>
                        <button class="pad-btn" data-key="3">3</button>
                        <button class="pad-btn" data-key="4">4</button>
                        <button class="pad-btn" data-key="5">5</button>
                        <button class="pad-btn" data-key="6">6</button>
                        <button class="pad-btn" data-key="7">7</button>
                        <button class="pad-btn" data-key="8">8</button>
                        <button class="pad-btn" data-key="9">9</button>
                        <button class="pad-btn" data-key="*">*</button>
                        <button class="pad-btn" data-key="0">0</button>
                        <button class="pad-btn" data-key="#">#</button>
                    </div>

                    <div class="phone-device__actions">
                        <button id="deleteBtn" class="action-btn action-btn--neutral">Delete</button>
                        <button id="clearBtn" class="action-btn action-btn--neutral">Clear</button>
                        <button id="callBtn" class="action-btn action-btn--call">Call</button>
                        <button id="endBtn" class="action-btn action-btn--end">End</button>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script>
        (function () {
            if (typeof window.p5 !== 'function') {
                return;
            }

            new p5(function (sketch) {
                let keypadSection;
                let resizeObserver;
                let glowButtons = [];
                let glowBoostUntil = new Map();
                let animationFrameId = null;
                const GLOW_BOOST_MS = 220;

                function drawGlow(ctx, x, y, radius, strength) {
                    const boostedStrength = Math.max(1, strength || 1);
                    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                    gradient.addColorStop(0, 'rgba(255, 200, 230, ' + (0.95 * boostedStrength).toFixed(3) + ')');
                    gradient.addColorStop(0.16, 'rgba(255, 130, 205, ' + (0.5 * boostedStrength).toFixed(3) + ')');
                    gradient.addColorStop(0.38, 'rgba(255, 90, 176, ' + (0.18 * boostedStrength).toFixed(3) + ')');
                    gradient.addColorStop(1, 'rgba(255, 90, 176, 0)');

                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                function renderGlow() {
                    if (!keypadSection) {
                        keypadSection = document.querySelector('.phone-device__keypad-section');
                    }

                    if (!keypadSection) {
                        return;
                    }

                    const ctx = sketch.drawingContext;
                    const sectionRect = keypadSection.getBoundingClientRect();
                    const buttons = glowButtons.length ? glowButtons : keypadSection.querySelectorAll('.quick-btn, .pad-btn, .action-btn');
                    const now = performance.now();

                    sketch.resizeCanvas(Math.max(1, Math.round(sectionRect.width)), Math.max(1, Math.round(sectionRect.height)));
                    sketch.clear();
                    ctx.save();
                    ctx.globalCompositeOperation = 'screen';
                    ctx.filter = 'blur(0px)';

                    buttons.forEach(function (button) {
                        const rect = button.getBoundingClientRect();
                        const centerX = (rect.left - sectionRect.left) + (rect.width / 2);
                        const centerY = (rect.top - sectionRect.top) + (rect.height / 2);
                        const mirroredX = sectionRect.width - centerX;
                        const mirroredY = sectionRect.height - centerY;
                        const baseRadius = Math.min(rect.width, rect.height) * 0.45;
                        const boostUntil = glowBoostUntil.get(button) || 0;
                        const isBoosted = boostUntil > now;
                        const boostProgress = isBoosted ? (boostUntil - now) / GLOW_BOOST_MS : 0;
                        const radiusBoost = 1 + (boostProgress * 1.1);
                        const strengthBoost = 1 + (boostProgress * 0.9);

                        drawGlow(ctx, mirroredX, mirroredY, Math.max(8, baseRadius * 1.0 * radiusBoost), strengthBoost);
                        drawGlow(ctx, mirroredX, mirroredY, Math.max(5, baseRadius * 0.55 * radiusBoost), strengthBoost);

                        if (!isBoosted && glowBoostUntil.has(button)) {
                            glowBoostUntil.delete(button);
                        }
                    });

                    ctx.restore();
                }

                function hasActiveBoost() {
                    const now = performance.now();

                    return glowButtons.some(function (button) {
                        return (glowBoostUntil.get(button) || 0) > now;
                    });
                }

                function runGlowAnimationFrame() {
                    renderGlow();

                    if (hasActiveBoost()) {
                        animationFrameId = window.requestAnimationFrame(runGlowAnimationFrame);
                        return;
                    }

                    animationFrameId = null;
                }

                function startGlowAnimation() {
                    if (animationFrameId !== null) {
                        return;
                    }

                    animationFrameId = window.requestAnimationFrame(runGlowAnimationFrame);
                }

                function registerGlowBoostHandlers() {
                    glowButtons.forEach(function (button) {
                        button.addEventListener('pointerdown', function () {
                            glowBoostUntil.set(button, performance.now() + GLOW_BOOST_MS);
                            startGlowAnimation();
                        });
                    });
                }

                sketch.setup = function () {
                    keypadSection = document.querySelector('.phone-device__keypad-section');
                    glowButtons = keypadSection
                        ? Array.from(keypadSection.querySelectorAll('.quick-btn, .pad-btn, .action-btn'))
                        : [];

                    const initialWidth = keypadSection ? keypadSection.clientWidth : sketch.windowWidth;
                    const initialHeight = keypadSection ? keypadSection.clientHeight : sketch.windowHeight;
                    const canvas = sketch.createCanvas(Math.max(1, initialWidth), Math.max(1, initialHeight));

                    canvas.parent(keypadSection || document.body);
                    canvas.addClass('phone-app-p5-layer');
                    sketch.noLoop();

                    registerGlowBoostHandlers();

                    renderGlow();

                    window.setTimeout(renderGlow, 60);
                    window.setTimeout(renderGlow, 180);
                    window.setTimeout(renderGlow, 420);

                    if (typeof ResizeObserver !== 'undefined' && keypadSection) {
                        resizeObserver = new ResizeObserver(function () {
                            renderGlow();
                        });

                        resizeObserver.observe(keypadSection);
                    }
                };

                sketch.windowResized = function () {
                    renderGlow();
                };
            });
        })();

        (function () {
            const MAX_DIGITS = 14;
            const callDelayMs = 900;
            const dtmfSources = {
                '1': './assets/Telephone-DTMF01-01(1).mp3',
                '2': './assets/Telephone-DTMF01-02(2).mp3',
                '3': './assets/Telephone-DTMF01-03(3).mp3',
                '4': './assets/Telephone-DTMF01-04(4).mp3',
                '5': './assets/Telephone-DTMF01-05(5).mp3',
                '6': './assets/Telephone-DTMF01-06(6).mp3',
                '7': './assets/Telephone-DTMF01-07(7).mp3',
                '8': './assets/Telephone-DTMF01-08(8).mp3',
                '9': './assets/Telephone-DTMF01-09(9).mp3',
                '*': './assets/Telephone-DTMF01-10(Star).mp3',
                '0': './assets/Telephone-DTMF01-11(0).mp3',
                '#': './assets/Telephone-DTMF01-12(Hash).mp3'
            };

            const dialDisplay = document.getElementById('dialDisplay');
            const statusLabel = document.getElementById('statusLabel');
            const deleteBtn = document.getElementById('deleteBtn');
            const clearBtn = document.getElementById('clearBtn');
            const callBtn = document.getElementById('callBtn');
            const endBtn = document.getElementById('endBtn');
            const padButtons = document.querySelectorAll('.pad-btn');
            const quickButtons = document.querySelectorAll('.quick-btn');

            let dialedNumber = '';
            let callState = 'idle';
            let callStartedAt = null;
            let callTimer = null;
            let dialTimer = null;
            let audioContext = null;
            let audioContextReady = false;
            let dtmfBufferMap = new Map();
            let ringLoopBuffer = null;
            let ringLoopSource = null;
            let preloadStarted = false;
            let userInteractionReady = false;
            let katanaSoundStarted = false;
            const ringLoopAudio = new Audio('./assets/phone-call.mp3');
            ringLoopAudio.loop = true;
            ringLoopAudio.preload = 'auto';
            ringLoopAudio.playsInline = true;
            const katanaAudio = new Audio('./assets/katana.mp3');
            katanaAudio.preload = 'auto';
            katanaAudio.playsInline = true;
            const dtmfFallbackAudioMap = new Map();

            Object.keys(dtmfSources).forEach(function (key) {
                const tone = new Audio(dtmfSources[key]);
                tone.preload = 'auto';
                tone.playsInline = true;
                dtmfFallbackAudioMap.set(key, tone);
            });

            function getAudioContext() {
                if (!audioContext) {
                    const AudioContextCtor = window.AudioContext || window.webkitAudioContext;

                    if (!AudioContextCtor) {
                        return null;
                    }

                    audioContext = new AudioContextCtor({ latencyHint: 'interactive' });
                }

                return audioContext;
            }

            async function ensureAudioContextReady() {
                const ctx = getAudioContext();

                if (!ctx) {
                    return null;
                }

                if (ctx.state !== 'running') {
                    try {
                        await ctx.resume();
                    } catch (error) {
                        return null;
                    }
                }

                audioContextReady = true;
                return ctx;
            }

            async function prepareAudioPlayback() {
                if (userInteractionReady) {
                    return true;
                }

                const ctx = await ensureAudioContextReady();

                if (!ctx) {
                    return false;
                }

                userInteractionReady = true;

                try {
                    ringLoopAudio.load();
                    katanaAudio.load();
                } catch (error) {
                }

                return true;
            }

            async function decodeAudioBuffer(src) {
                const ctx = await ensureAudioContextReady();

                if (!ctx) {
                    return null;
                }

                try {
                    const response = await fetch(src);

                    if (!response.ok) {
                        return null;
                    }

                    const arrayBuffer = await response.arrayBuffer();
                    return await ctx.decodeAudioData(arrayBuffer);
                } catch (error) {
                    return null;
                }
            }

            async function preloadAudioBuffers() {
                if (preloadStarted) {
                    return;
                }

                preloadStarted = true;

                const dtmfKeys = Object.keys(dtmfSources);

                await Promise.all(dtmfKeys.map(async function (key) {
                    const buffer = await decodeAudioBuffer(dtmfSources[key]);

                    if (buffer) {
                        dtmfBufferMap.set(key, buffer);
                    }
                }));

                ringLoopBuffer = await decodeAudioBuffer('./assets/phone-call.mp3');
            }

            function primeAudio() {
                prepareAudioPlayback().then(function (ready) {
                    if (!ready) {
                        return;
                    }

                    preloadAudioBuffers();

                    if (!katanaSoundStarted) {
                        katanaSoundStarted = true;
                        katanaAudio.pause();
                        katanaAudio.currentTime = 0;
                        katanaAudio.play().catch(function () {
                        });
                    }
                });
            }

            async function playDtmfTone(key) {
                if (!userInteractionReady) {
                    await prepareAudioPlayback();
                }

                const buffer = dtmfBufferMap.get(key);

                if (audioContextReady && audioContext && buffer) {
                    const sourceNode = audioContext.createBufferSource();
                    sourceNode.buffer = buffer;
                    sourceNode.connect(audioContext.destination);
                    sourceNode.start(0);
                    return;
                }

                const tone = dtmfFallbackAudioMap.get(key);

                if (!tone) {
                    return;
                }

                tone.pause();
                tone.currentTime = 0;
                tone.play().catch(function () {
                });
            }

            async function startCallLoopAudio() {
                if (!userInteractionReady) {
                    await prepareAudioPlayback();
                }

                if (audioContextReady && audioContext && ringLoopBuffer) {
                    stopCallLoopAudio();

                    ringLoopSource = audioContext.createBufferSource();
                    ringLoopSource.buffer = ringLoopBuffer;
                    ringLoopSource.loop = true;
                    ringLoopSource.connect(audioContext.destination);
                    ringLoopSource.start(0);
                    return;
                }

                ringLoopAudio.pause();
                ringLoopAudio.currentTime = 0;
                ringLoopAudio.play().catch(function () {
                });
            }

            function stopCallLoopAudio() {
                if (ringLoopSource) {
                    try {
                        ringLoopSource.stop(0);
                    } catch (error) {
                    }

                    ringLoopSource.disconnect();
                    ringLoopSource = null;
                }

                if (ringLoopAudio) {
                    ringLoopAudio.pause();
                    ringLoopAudio.currentTime = 0;
                }
            }

            function setStatus(text) {
                statusLabel.textContent = text;
            }

            function formatCallTime(totalSeconds) {
                const minutes = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const seconds = Math.floor(totalSeconds % 60).toString().padStart(2, '0');
                return minutes + ':' + seconds;
            }

            function renderDial() {
                dialDisplay.textContent = dialedNumber || '_';
            }

            function stopTimers() {
                if (callTimer) {
                    window.clearInterval(callTimer);
                    callTimer = null;
                }

                if (dialTimer) {
                    window.clearTimeout(dialTimer);
                    dialTimer = null;
                }
            }

            function endCall() {
                stopTimers();
                stopCallLoopAudio();
                callState = 'idle';
                callStartedAt = null;
                setStatus('Ready');
            }

            function beginCall() {
                if (!dialedNumber) {
                    setStatus('Enter number');
                    return;
                }

                stopTimers();
                stopCallLoopAudio();
                callState = 'dialing';
                setStatus('Dialing...');

                dialTimer = window.setTimeout(function () {
                    callState = 'in-call';
                    callStartedAt = Date.now();
                    setStatus('In call 00:00');
                    startCallLoopAudio().catch(function () {
                    });

                    callTimer = window.setInterval(function () {
                        const elapsedSeconds = Math.floor((Date.now() - callStartedAt) / 1000);
                        setStatus('In call ' + formatCallTime(elapsedSeconds));
                    }, 1000);
                }, callDelayMs);
            }

            function addKey(key) {
                if (callState === 'in-call') {
                    return;
                }

                if (dialedNumber.length >= MAX_DIGITS) {
                    return;
                }

                playDtmfTone(key).catch(function () {
                });
                dialedNumber += key;
                setStatus('Number ready');
                renderDial();
            }

            function deleteLastDigit() {
                if (callState === 'in-call') {
                    return;
                }

                dialedNumber = dialedNumber.slice(0, -1);
                setStatus(dialedNumber ? 'Number ready' : 'Ready');
                renderDial();
            }

            function clearAllDigits() {
                if (callState === 'in-call') {
                    return;
                }

                dialedNumber = '';
                setStatus('Ready');
                renderDial();
            }

            function setQuickNumber(number) {
                if (callState === 'in-call') {
                    return;
                }

                dialedNumber = number;
                setStatus('Speed dial selected');
                renderDial();
            }

            padButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    addKey(button.dataset.key || '');
                });
            });

            quickButtons.forEach(function (button) {
                button.addEventListener('click', function () {
                    setQuickNumber(button.dataset.number || '');
                });
            });

            deleteBtn.addEventListener('click', deleteLastDigit);
            clearBtn.addEventListener('click', clearAllDigits);
            callBtn.addEventListener('click', beginCall);
            endBtn.addEventListener('click', endCall);

            window.addEventListener('click', primeAudio, { once: true });
            window.addEventListener('touchstart', primeAudio, { once: true });

            renderDial();
        })();

        (async function () {
            const BRIGHTNESS_DELTA_THRESHOLD = 0.1;
            const MAGENTA_SCORE_THRESHOLD = 0.05;
            const SAMPLE_INTERVAL_MS = 120;
            const BRIGHTNESS_SMOOTH_ALPHA = 0.5;

            function getIndexUrl() {
                if (window.location.pathname.indexOf('/public/') !== -1) {
                    return new URL('../index.html', window.location.href).href;
                }

                const isGitHubPages = window.location.hostname.endsWith('github.io');

                if (isGitHubPages) {
                    const pathMatch = window.location.pathname.match(/^\/([^/]+)\//);

                    if (pathMatch && pathMatch[1]) {
                        return '/' + pathMatch[1] + '/index.html';
                    }
                }

                return new URL('./index.html', window.location.href).href;
            }

            const indexUrl = getIndexUrl();

            console.log('[phoneApp] camera watcher starting');
            console.log('[phoneApp] index redirect target:', indexUrl);

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.warn('[phoneApp] getUserMedia is not available');
                return;
            }

            const video = document.createElement('video');
            video.autoplay = true;
            video.playsInline = true;
            video.muted = true;

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            if (!ctx) {
                console.warn('[phoneApp] 2d canvas context is not available');
                return;
            }

            let stream;

            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: false,
                });
            } catch (error) {
                console.warn('[phoneApp] getUserMedia failed', error);
                return;
            }

            video.srcObject = stream;

            try {
                await video.play();
            } catch (error) {
                console.warn('[phoneApp] video.play() failed', error);
                stream.getTracks().forEach(function (track) { track.stop(); });
                return;
            }

            console.log('[phoneApp] camera watcher active');

            let smoothedBrightness = null;
            let previousBrightness = null;

            const intervalId = window.setInterval(function () {
                if (video.readyState < 2 || video.videoWidth === 0 || video.videoHeight === 0) {
                    return;
                }

                canvas.width = 64;
                canvas.height = Math.max(36, Math.round((64 * video.videoHeight) / video.videoWidth));

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                let luminanceSum = 0;
                let redSum = 0;
                let greenSum = 0;
                let blueSum = 0;

                for (let i = 0; i < imageData.length; i += 4) {
                    const r = imageData[i];
                    const g = imageData[i + 1];
                    const b = imageData[i + 2];
                    luminanceSum += 0.2126 * r + 0.7152 * g + 0.0722 * b;
                    redSum += r;
                    greenSum += g;
                    blueSum += b;
                }

                const pixelCount = imageData.length / 4;
                const brightness = luminanceSum / (pixelCount * 255);
                smoothedBrightness =
                    smoothedBrightness === null
                        ? brightness
                        : smoothedBrightness + BRIGHTNESS_SMOOTH_ALPHA * (brightness - smoothedBrightness);
                const brightnessDelta = previousBrightness === null
                    ? 0
                    : smoothedBrightness - previousBrightness;
                previousBrightness = smoothedBrightness;
                const avgRed = redSum / (pixelCount * 255);
                const avgGreen = greenSum / (pixelCount * 255);
                const avgBlue = blueSum / (pixelCount * 255);
                const magentaScore = ((avgRed + avgBlue) / 2) - avgGreen;

                console.log(
                    '[brightness] ' + brightness.toFixed(3) +
                    ', [smooth] ' + smoothedBrightness.toFixed(3) +
                    ', [delta] ' + brightnessDelta.toFixed(3) +
                    ', [rgb] ' + avgRed.toFixed(3) + ', ' + avgGreen.toFixed(3) + ', ' + avgBlue.toFixed(3) +
                    ', [magentaScore] ' + magentaScore.toFixed(3) +
                    ', [threshold] ' + MAGENTA_SCORE_THRESHOLD.toFixed(3)
                );

                if (brightnessDelta >= BRIGHTNESS_DELTA_THRESHOLD) {
                    window.clearInterval(intervalId);
                    stream.getTracks().forEach(function (track) { track.stop(); });
                    window.location.replace(indexUrl);
                    return;
                }

                if (magentaScore < MAGENTA_SCORE_THRESHOLD) {
                    window.clearInterval(intervalId);
                    stream.getTracks().forEach(function (track) { track.stop(); });
                    window.location.replace('./chooseApp.html?v=2');
                    return;
                }
            }, SAMPLE_INTERVAL_MS);

            window.addEventListener('beforeunload', function () {
                window.clearInterval(intervalId);

                if (stream) {
                    stream.getTracks().forEach(function (track) { track.stop(); });
                }
            });
        })();

    </script>
</body>

</html>
